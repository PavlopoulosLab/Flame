# Flame 3.0 with Docker Compose:  docker compose up -d   →   http://localhost:8000
#
# Configuration is read from a ".env" file in this directory (Docker Compose
# loads it automatically); every "${VAR:-default}" below falls back to the
# default shown when .env doesn't set VAR, or when there is no .env at all.
# Copy .env.example to .env and edit it to override any of these.
services:
  flame:
    build:
      context: .
      args:
        # Subpath to serve the app under (e.g. "/flame/"); baked into the web
        # build, so changing it requires a rebuild, not just a restart. Leave
        # as "/" unless you're putting Flame behind a reverse-proxy subpath.
        FLAME_BASE_PATH: "${FLAME_BASE_PATH:-/}"
    image: pavlopouloslab/flame:3.0
    ports:
      - "${FLAME_HTTP_PORT:-8000}:${FLAME_PORT:-8000}"
    volumes:
      - flame-data:/data
    environment:
      FLAME_PORT: "${FLAME_PORT:-8000}"
      FLAME_DB: "${FLAME_DB:-/data/flame.sqlite}"
      FLAME_WORKERS: "${FLAME_WORKERS:-4}"
      FLAME_RETENTION_DAYS: "${FLAME_RETENTION_DAYS:-30}"
      FLAME_MAX_LISTS: "${FLAME_MAX_LISTS:-10}"
      FLAME_WORKSPACE_LIMIT: "${FLAME_WORKSPACE_LIMIT:-30}"
      FLAME_RATE_LIMIT: "${FLAME_RATE_LIMIT:-600}"
      FLAME_PUBLIC_URL: "${FLAME_PUBLIC_URL:-}"   # used in links and emails
      FLAME_NCBI_API_KEY: "${FLAME_NCBI_API_KEY:-}"   # PubMed / dbSNP inputs: 10 instead of 3 requests/s
      FLAME_SMTP_URL: "${FLAME_SMTP_URL:-}"
      FLAME_SMTP_FROM: "${FLAME_SMTP_FROM:-}"
    restart: unless-stopped

volumes:
  flame-data:
